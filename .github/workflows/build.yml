name: Build game

# Builds the single-file index.html from sources and commits it back to main,
# so GitHub Pages (main / root) always serves the latest passing build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Syntax check
        run: |
          cd build
          node --check logic.js
          node --check game.js

      - name: Logic tests
        run: |
          cd build
          node test_logic.js

      - name: Boot smoke test
        run: |
          cd build
          node test_boot.js

      - name: Build single-file index.html
        run: |
          cd build
          python3 build.py ../index.html
          ls -la ../index.html

      - name: Commit built index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f index.html
          # [skip ci] prevents the push from re-triggering this workflow
          git commit -m "Build index.html [skip ci]" || echo "no changes to commit"
          git push origin main
